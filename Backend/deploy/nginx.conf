# Nginx reverse proxy + HTTPS for the Portfolio FastAPI backend.
# Install to: /etc/nginx/sites-available/portfolio-backend
# then: ln -s /etc/nginx/sites-available/portfolio-backend /etc/nginx/sites-enabled/
#
# Replace api.example.com with your real domain everywhere below.
# TLS certs are issued by certbot (see DEPLOY.md) — until then, run the
# certbot --nginx step which fills in the ssl_certificate lines automatically.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Allow ACME http-01 challenge for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # Managed by certbot:
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow file/media uploads (R2 admin uploads).
    client_max_body_size 50M;

    # Proxy everything to the uvicorn app on localhost:8000.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
